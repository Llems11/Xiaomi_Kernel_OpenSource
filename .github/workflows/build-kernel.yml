name: Build Kernel dew KernelSU-Next + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: dew-v-oss

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make \
          libelf-dev gcc-aarch64-linux-gnu git curl python3 \
          zip unzip

      - name: Setup KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash

      - name: Apply SUSFS patches
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch ./
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch && cd ..
          patch -p1 < 50_add_susfs_in_kernel-4.19.patch

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make dew_defconfig
          make -j$(nproc)

      - name: Upload init_boot
        uses: actions/upload-artifact@v4
        with:
          name: init_boot_ksunext_susfs
          path: arch/arm64/boot/Image
