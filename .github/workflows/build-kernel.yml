name: Build Kernel dew KernelSU-Next + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make \
          libelf-dev gcc-aarch64-linux-gnu git curl python3 \
          zip unzip cpio lz4

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
          -b dew-v-oss kernel

      - name: Setup KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash

      - name: Clone y aplicar SUSFS
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19
          cd kernel
          mkdir -p fs include/linux
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch ./
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./kernel_10_enable_susfs.patch
          cd KernelSU && patch -p1 --fuzz=3 --ignore-whitespace < ../kernel_10_enable_susfs.patch || true && cd ..
          patch -p1 --fuzz=3 --ignore-whitespace < 50_add_susfs_in_kernel-4.19.patch || true

      - name: Compilar kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          make olddefconfig
          make -j$(nproc) 2>&1 | tail -80

      - name: Obtener magiskboot desde Magisk APK
        run: |
          curl -Lo magisk.apk https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk-v30.7.apk || \
          curl -Lo magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot
          ./magiskboot --help 2>&1 | head -5 || true

      - name: Descargar init_boot de gofile y reempaquetar
        run: |
          # Obtener token de gofile
          TOKEN=$(curl -s "https://api.gofile.io/accounts" -X POST | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['token'])")
          
          # Obtener info del archivo
          FILE_INFO=$(curl -s "https://api.gofile.io/contents/q5t3aW?wt=4fd6sg89d7s6&cache=true" -H "Authorization: Bearer $TOKEN")
          echo "File info: $FILE_INFO" | head -c 500
          
          DOWNLOAD_URL=$(echo $FILE_INFO | python3 -c "
          import sys,json
          data=json.load(sys.stdin)
          contents=data['data']['children']
          key=list(contents.keys())[0]
          print(contents[key]['link'])
          ")
          
          echo "Descargando desde: $DOWNLOAD_URL"
          curl -Lo init_boot_patched.img -H "Authorization: Bearer $TOKEN" "$DOWNLOAD_URL"
          ls -lh init_boot_patched.img

          # Desempaquetar
          ./magiskboot unpack init_boot_patched.img

          # Reemplazar kernel con el nuevo compilado con SUSFS
          cp kernel/arch/arm64/boot/Image kernel

          # Reempaquetar
          ./magiskboot repack init_boot_patched.img init_boot_SUSFS_FINAL.img
          ls -lh init_boot_SUSFS_FINAL.img

      - name: Subir init_boot final
        uses: actions/upload-artifact@v4
        with:
          name: init_boot_SUSFS_FINAL
          path: init_boot_SUSFS_FINAL.img
