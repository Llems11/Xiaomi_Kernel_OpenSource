name: Build Kernel dew KernelSU-Next + SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make \
          libelf-dev gcc-aarch64-linux-gnu git curl python3 \
          zip unzip cpio

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
          -b dew-v-oss kernel

      - name: Setup KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash

      - name: Clone y aplicar SUSFS
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19
          cd kernel
          mkdir -p fs include/linux
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch ./
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./kernel_10_enable_susfs.patch
          cd KernelSU && patch -p1 --fuzz=3 --ignore-whitespace < ../kernel_10_enable_susfs.patch || true && cd ..
          patch -p1 --fuzz=3 --ignore-whitespace < 50_add_susfs_in_kernel-4.19.patch || true

      - name: Compilar kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          # Habilitar KernelSU y SUSFS en el config
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          make olddefconfig
          make -j$(nproc) 2>&1 | tail -80

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: kernel_Image_ksunext_susfs
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/Image.gz
