name: Build Kernel dew KernelSU-Next + SUSFS

on:
  workflow_dispatch:
    inputs:
      init_boot_url:
        description: 'URL directa del init_boot_patched.img (sube el archivo a gofile.io y pega el link directo)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make \
          libelf-dev gcc-aarch64-linux-gnu git curl python3 \
          zip unzip cpio lz4

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
          -b dew-v-oss kernel

      - name: Setup KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash

      - name: Clone y aplicar SUSFS
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19
          cd kernel
          mkdir -p fs include/linux
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch ./
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./kernel_10_enable_susfs.patch
          cd KernelSU && patch -p1 --fuzz=3 --ignore-whitespace < ../kernel_10_enable_susfs.patch || true && cd ..
          patch -p1 --fuzz=3 --ignore-whitespace < 50_add_susfs_in_kernel-4.19.patch || true

      - name: Compilar kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          make olddefconfig
          make -j$(nproc) 2>&1 | tail -80

      - name: Descargar init_boot parcheado y reempaquetar
        run: |
          # Descargar magiskboot para Linux
          curl -Lo magiskboot https://github.com/PinNaCode/magiskboot_build/releases/download/last-ci/magiskboot_x86_64-unknown-linux-musl
          chmod +x magiskboot

          # Descargar el init_boot parcheado por KernelSU-Next
          curl -Lo init_boot_patched.img "${{ github.event.inputs.init_boot_url }}"

          # Desempaquetar
          ./magiskboot unpack init_boot_patched.img

          # Reemplazar kernel con el nuevo compilado con SUSFS
          cp kernel/arch/arm64/boot/Image kernel

          # Reempaquetar
          ./magiskboot repack init_boot_patched.img init_boot_SUSFS_FINAL.img

      - name: Subir init_boot final
        uses: actions/upload-artifact@v4
        with:
          name: init_boot_SUSFS_FINAL
          path: init_boot_SUSFS_FINAL.img
